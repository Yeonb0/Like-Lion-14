<body>
  <header>🙂 저는 김보연입니다.</header>
  <nav>
    <a>프로필</a>
    <a>TMI</a>
    <a>한 줄 소개</a>
  </nav>
  <section id="profile">
    <h2>😺 프로필</h2>
    <table>
      <tr>
        <th>이름</th>
        <td>김보연</td>
      </tr>
      <tr>
        <th>파트</th>
        <td>프론트엔드</td>
      </tr>
      <tr>
        <th>전공</th>
        <td>철학, 종교학, 컴퓨터공학</td>
      </tr>
    </table>
  </section>

  <section id="tmi">
    <h2>😺 내 TMI</h2>
    <div class="tmi-container">
      <div class="tmi-card">
        <img class="tmi-img" src="./images/닭다리살.jpg" alt="닭다리살">
        <p><strong>요즘 최애 음식</strong><br>아침으로 매일 닭다리살을 먹고 있습니다.</p>
      </div>
      <div class="tmi-card">
        <img class="tmi-img" src="./images/intp2.png" alt="INTP">
        <p><strong>MBTI</strong><br>INTP</p>
      </div>
      <div class="tmi-card">
        <img class="tmi-img" src="./images/Disconnected.jpg" alt="Disconnected">
        <p><strong>요즘 듣는 음악</strong><br>컴퓨터 바탕화면에서 <br/> 나오는 노래입니다.</p>
      </div>
    </div>
  </section>

  <section id="comment">
    <h2>✨ 한 줄 소개 남기기</h2>
    <form>
      <input type="text" placeholder="한 줄 소개를 입력하세요!"/>
      <button type="submit">등록</button>
    </form>
  </section>

  <footer>
    <a href="https://github.com/Yeonb0" target="_blank">GitHub Profile</a>
    <br/><span class="copyright">© 2026 김보연. All Rights Reserved.</span>
  </footer>
