<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>
</head>
<body>
  <h1>타임리프 익히기</h1>
  <!-- LocalDate 를 yyyy-MM-dd 형식으로 표시 -->
  <p th:text="${#temporals.format(today, 'yyyy-MM-dd')}"></p>
  <div th:object="${person}"> <!-- person 을 선택한 객체로 지정 -->
    <p th:text="|이름 : *{name}"></p>
    <p th:text="|나이 : *{age}"></p>
    <p th:text="|취미 : *{hobbies}"></p> 
    <ul th:each="hobby : *{hobbies}"> <!-- person 의 hobbies 를 반복 -->
      <li th:text="${hobby}"></li>
      <span th:if="${hobby == '운동'}">(대표 취미)</span>
    </ul>
  </div>
  <!-- 1번 블로그 글을 보러 이동 -->
  <a th:href="@{/api/articles/{id}(id=${person.id})}">글 보기</a>
</body>
</html>
