<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 글</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- js 파일 추가 -->
  <script src="/js/article.js" defer></script>
</head>
<body>
  <div class="p-5 mb-5 text-center</> bg-light">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
  </div>

  <div class="container mt-5">
    <div class="row">
      <div class="col-lg-8">
        <article>
          <!-- 블로그 글 id 추가 -->
          <input type="hidden" th:value="${article.id}" id="article-id" />
          <header class="mb-4">
            <h1 class="fw-bolder mb-1" th:text="${article.title}"></h1>
            <div class="text-muted fst-italic mb-2" th:text="|Posted on ${#temporals.format(article.createdAt, 'yyyy-MM-dd')} By ${article.author}|"></div>
          </header>
          <section class="mb-4" th:if="${article.imageUrl != null and article.imageUrl != ''}">
            <img th:src="${article.imageUrl}" alt="게시글 이미지" class="img-fluid" style="max-width: 100%; height: auto;">
          </section>
          <section class="mb-5">
            <p class="fs-5 mb-4" th:text="${article.content}"></p>
          </section>
          <button type="button" class="btn btn-primary btn-sm" id="modify-btn" th:onclick="|location.href='@{/new-article(id=${article.id})}'|">수정</button>
          <!-- [삭제] 버튼에 id 추가 -->
          <button type="button" class="btn btn-secondary btn-sm" id="delete-btn">삭제</button>
        </article>
      </div>
    </div>
  </div>
</body>
</html>
