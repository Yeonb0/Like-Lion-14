<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 글</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="/js/article.js" defer></script>
</head>
<body>
  <div class="p-5 mb-5 text-center</> bg-light">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
  </div>

  <div class="container mt-5">
    <div class="row">
      <div class="col-lg-8">
        <article>
          <!-- 아이디 정보 저장 -->
          <input type="hidden" th:value="${article.id}" id="articleId">

          <header class="mb-4">
            <input type="text" class="form-control" th:value="${article.title}" id="title" placeholder="제목">
          </header>
          <section class="mb-5">
            <textarea class="form-control h-25" rows="10" th:text="${article.content}" id="content" placeholder="내용"></textarea>
          </section>
          <!-- id 가 있을 때는 [수정] 버튼, 없을 때는 [등록] 버튼 -->
          <button type="button" class="btn btn-primary btn-sm" th:if="${article.id != null}" id="modify-btn">수정</button>
          <button type="button" class="btn btn-primary btn-sm" th:if="${article.id == null}" id="create-btn">등록</button>
        </article>
      </div>
    </div>
  </div>
</body>
</html>
