<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 글</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="/js/article.js" defer></script>
</head>
<body>
  <div class="p-5 mb-5 text-center bg-light">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
  </div>

  <div class="container mt-5">
    <div class="row">
      <div class="col-lg-8">
        <article>
          <!-- 아이디 정보 저장 -->
          <input type="hidden" th:value="${article.id}" id="articleId">

          <header class="mb-4">
            <input type="text" class="form-control" th:value="${article.title}" id="title" placeholder="제목">
          </header>
          <section class="mb-4">
            <label for="image-upload" class="form-label">이미지 업로드</label>
            <div class="input-group mb-2">
              <input type="file" class="form-control" id="image-upload" accept="image/*">
              <button type="button" id="ai-thumbnail-btn" class="btn btn-outline-secondary">AI 섬네일 생성</button>
            </div>
            <input type="hidden" id="image-url" th:value="${article.imageUrl}">
            <div id="ai-thumbnail-loading" class="mt-2" style="display: none;">
              <div class="spinner-border spinner-border-sm text-primary" role="status">
                <span class="sr-only">Loading...</span>
              </div>
              <span class="ml-2">AI가 섬네일을 생성하고 있습니다... (30초 정도 소요됩니다.)</span>
            </div>
            <div id="image-preview" class="mt-3" style="display:none;">
              <img id="preview-img" src="" alt="미리보기" style="max-width: 100%; max-height: 400px">
              <br>
              <button type="button" id="remove-image-btn" class="btn btn-sm btn-danger mt-2">이미지 제거</button>
            </div>
          </section>
          <section class="mb-5">
            <textarea class="form-control h-25" rows="10" th:text="${article.content}" id="content" placeholder="내용"></textarea>
          </section>
          <!-- AI 도움 버튼 추가-->
          <button type="button" class="btn btn-info btn-sm" id="ai-assist-btn">AI 도움 받기</button>
          <!-- id 가 있을 때는 [수정] 버튼, 없을 때는 [등록] 버튼 -->
          <button type="button" class="btn btn-primary btn-sm" th:if="${article.id != null}" id="modify-btn">수정</button>
          <button type="button" class="btn btn-primary btn-sm" th:if="${article.id == null}" id="create-btn">등록</button>
        </article>
      </div>
    </div>
  </div>

  <div class="modal fade" id="aiAssistModal" tabindex="-1" role="dialog" aria-labelledby="aiAssistModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="aiAssistModalLabel">AI 글쓰기 도우미</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
              <label for="ai-question">어떤 부분이 고민되시나요?</label>
              <textarea class="form-control" id="ai-question" rows="3" placeholder="예: 이 다음에 어떤 내용을 써야 할까요?"></textarea>
          </div>
          <button type="button" id="get-suggestions-btn" class="btn btn-primary">제안 받기</button>
          <div id="ai-loading" class="mt-3" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
              </div>
            <span class="ml-2">AI가 생각하고 있습니다...</span>
          </div>
          <div id="ai-suggestions" class="mt-3" style="display: none;">
            <h6>AI 제안:</h6>
            <div id="ai-suggestion-content"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
</body>
</html>
