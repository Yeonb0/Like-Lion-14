spring.application.name=springblog

# H2 콘솔 활성화 (WebSecurityConfig 의 toH2Console() 매처가 이 설정을 필요로 함)
spring.h2.console.enabled=true

# 인메모리 DB 이름을 고정 (지정하지 않으면 매 기동마다 임의 이름이 생성되어
# H2 콘솔의 jdbc:h2:mem:testdb 로 접속할 수 없다)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 프로젝트 루트의 .env 파일을 설정으로 읽어들인다 (파일이 없어도 기동은 진행)
spring.config.import=optional:file:.env[.properties]

# Google GenAI (Gemini) API Key - .env 의 GOOGLE_AI_API_KEY 값을 사용
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:}
